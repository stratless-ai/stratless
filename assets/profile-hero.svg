<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 548" xml:space="preserve">
  <defs>
    <clipPath id="card"><rect x="18" y="14" width="564" height="520" rx="11"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3831"/><stop offset="1" stop-color="#322f29"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#14120c" flood-opacity="0.45"/>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #e6e2d6; }
      .g  { fill: #8fce6b; font-weight: 700; }
      .pa { fill: #5fb3c9; font-weight: 700; }
      .w  { fill: #f4f1e8; font-weight: 700; }
      .d  { fill: #8b8677; }
    </style>
  </defs>

  <g filter="url(#sh)"><rect x="18" y="14" width="564" height="520" rx="11" fill="#1b1a16" stroke="#000"/></g>
  <g clip-path="url(#card)">
    <rect x="18" y="14" width="564" height="40" fill="url(#bar)"/>
    <line x1="18" y1="54" x2="582" y2="54" stroke="#000"/>
  </g>
  <circle cx="42" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="34" r="6" fill="#febc2e"/>
  <circle cx="82" cy="34" r="6" fill="#28c840"/>
  <text x="300" y="38" text-anchor="middle" fill="#b9b3a3" font-size="11">~, -zsh, 92x24</text>

  <text x="36" y="74"><tspan class="g">➜</tspan>  <tspan class="pa">~</tspan> <tspan class="w">stratless profile</tspan></text>

  <text x="36" y="106" class="w">WHO YOU'RE WORKING WITH</text>

  <text x="36" y="142"><tspan class="d">##</tspan> <tspan class="w">What to offer me before I ask</tspan></text>
  <text x="36" y="163">- offer to enter a planning step before touching</text>
  <text x="52" y="184">any implementation. <tspan class="d">(265× · slip 28×)</tspan></text>

  <text x="36" y="224"><tspan class="d">##</tspan> <tspan class="w">What to catch for me</tspan></text>
  <text x="36" y="245">- catch language or framing that undersells quality;</text>
  <text x="52" y="266">they will reject a term or shortcut they find weak. <tspan class="d">(169×)</tspan></text>

  <text x="36" y="306"><tspan class="d">##</tspan> <tspan class="w">How to talk to me</tspan></text>
  <text x="36" y="327">- let them lay out multi-part strategic reasoning and</text>
  <text x="52" y="348">respond with a clear stance, not just agreement. <tspan class="d">(236×, rising)</tspan></text>

  <text x="36" y="390" class="d">not loaded yet · load it into your assistant: stratless update</text>

  <text x="36" y="426"><tspan class="g">➜</tspan>  <tspan class="pa">~</tspan> <tspan class="w">stratless update</tspan></text>

  <text x="36" y="458"><tspan class="g">↳ loaded</tspan>  <tspan class="d">your assistant now talks to a person, not a blank.</tspan></text>

  <text x="36" y="490"><tspan class="g">➜</tspan>  <tspan class="pa">~</tspan></text>
  <rect x="75" y="478" width="8" height="15" fill="#e6e2d6"/>
</svg>
