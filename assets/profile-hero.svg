<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 548" xml:space="preserve">
  <defs>
    <clipPath id="card"><rect x="18" y="14" width="564" height="520" rx="11"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3831"/><stop offset="1" stop-color="#322f29"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#14120c" flood-opacity="0.45"/>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #e6e2d6; }
      .g  { fill: #8fce6b; font-weight: 700; }
      .pa { fill: #5fb3c9; font-weight: 700; }
      .w  { fill: #f4f1e8; font-weight: 700; }
      .d  { fill: #8b8677; }
    </style>
  </defs>

  <g filter="url(#sh)"><rect x="18" y="14" width="564" height="520" rx="11" fill="#1b1a16" stroke="#000"/></g>
  <g clip-path="url(#card)">
    <rect x="18" y="14" width="564" height="40" fill="url(#bar)"/>
    <line x1="18" y1="54" x2="582" y2="54" stroke="#000"/>
  </g>
  <circle cx="42" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="34" r="6" fill="#febc2e"/>
  <circle cx="82" cy="34" r="6" fill="#28c840"/>
  <text x="300" y="38" text-anchor="middle" fill="#b9b3a3" font-size="11">~, -zsh, 92x24</text>

  <text x="36" y="74"><tspan class="g">➜</tspan>  <tspan class="pa">~</tspan> <tspan class="w">stratless tune</tspan></text>

  <text x="36" y="106" class="w">Your tune — Claude Code pair</text>

  <text x="36" y="138"><tspan class="w">Measured from this record:</tspan> 8 rituals · 8 lessons</text>
  <text x="52" y="159">· 9 rules · 1 win · 8 arrivals</text>

  <text x="36" y="191">The sitting asks your own Claude Code once — about</text>
  <text x="36" y="212">$0.08 of your plan. Proceed? <tspan class="d">[y/N]</tspan> y</text>

  <text x="36" y="248" class="w">2 skills proposed from the evidence</text>

  <text x="36" y="280">⚙ <tspan class="w">watch-ci-after-merge</tspan>  <tspan class="d">(occurrences 283 · sessions 88)</tspan></text>
  <text x="52" y="301" class="d">A completed merge is followed by an actual CI status</text>
  <text x="52" y="322" class="d">check before the turn is called finished.</text>

  <text x="36" y="354">⚙ <tspan class="w">name-the-mechanism-plainly</tspan>  <tspan class="d">(count 4 · sessions 4)</tspan></text>
  <text x="52" y="375" class="d">Every direct meaning-question gets a concrete,</text>
  <text x="52" y="396" class="d">jargon-free answer naming the actual mechanism.</text>

  <text x="36" y="432" class="d">writes to ~/.claude/skills · nothing else touched</text>
  <text x="36" y="453" class="d">every receipt is your own count · remove any time: stratless stop</text>

  <text x="36" y="490">Install? <tspan class="d">[y/N]</tspan></text>
  <rect x="120" y="478" width="8" height="15" fill="#e6e2d6"/>
</svg>
