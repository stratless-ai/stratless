<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 575" xml:space="preserve">
  <defs>
    <clipPath id="card"><rect x="18" y="14" width="564" height="547" rx="11"/></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3831"/><stop offset="1" stop-color="#322f29"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#14120c" flood-opacity="0.45"/>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #e6e2d6; }
      .g  { fill: #8fce6b; font-weight: 700; }
      .pa { fill: #5fb3c9; font-weight: 700; }
      .w  { fill: #f4f1e8; font-weight: 700; }
      .d  { fill: #8b8677; }
      .y  { fill: #6cb6d9; }
    </style>
  </defs>

  <g filter="url(#sh)"><rect x="18" y="14" width="564" height="547" rx="11" fill="#1b1a16" stroke="#000"/></g>
  <g clip-path="url(#card)">
    <rect x="18" y="14" width="564" height="40" fill="url(#bar)"/>
    <line x1="18" y1="54" x2="582" y2="54" stroke="#000"/>
  </g>
  <circle cx="42" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="34" r="6" fill="#febc2e"/>
  <circle cx="82" cy="34" r="6" fill="#28c840"/>
  <text x="300" y="38" text-anchor="middle" fill="#b9b3a3" font-size="11">my-app, -zsh, 92x20</text>

  <text x="36" y="74"><tspan class="g">➜</tspan>  <tspan class="pa">~/my-app</tspan> <tspan class="w">stratless profile</tspan></text>

  <text x="36" y="106" class="d"># who you are working with, read from your own history</text>

  <text x="36" y="142" class="w">HOW THEY WORK</text>
  <text x="36" y="167">Muses openly about direction and invites free-form</text>
  <text x="36" y="188">discussion rather than a single pointed question.</text>
  <text x="36" y="209"><tspan class="d">876 times ·</tspan> <tspan class="y">"fast to sell and painkiller?"</tspan></text>

  <text x="36" y="251">Gives a short signal (go, commit it) to authorize</text>
  <text x="36" y="272">the next step without further discussion.</text>
  <text x="36" y="293"><tspan class="d">727 times ·</tspan> <tspan class="y">"Go with A, fix the counts"</tspan></text>

  <text x="36" y="335" class="w">WHEN SOMETHING HAS GONE WRONG</text>
  <text x="36" y="360">Insists on a plan, and plan mode, before any code</text>
  <text x="36" y="381">gets written.</text>
  <text x="36" y="402"><tspan class="d">256 times ·</tspan> <tspan class="y">"wait. are you in plan mode?"</tspan></text>

  <text x="36" y="444" class="d">not loaded yet · load it into your assistant: stratless update</text>

  <text x="36" y="480"><tspan class="g">➜</tspan>  <tspan class="pa">~/my-app</tspan> <tspan class="w">stratless update</tspan></text>

  <text x="36" y="512"><tspan class="g">↳ loaded</tspan>  <tspan class="d">your assistant now talks to a person, not a blank.</tspan></text>

  <text x="36" y="544"><tspan class="g">➜</tspan>  <tspan class="pa">~/my-app</tspan></text>
  <rect x="133" y="532" width="8" height="15" fill="#e6e2d6"/>
</svg>
