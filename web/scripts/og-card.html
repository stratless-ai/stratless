  :root {
    --paper: #e9e5d8; --paper-2: #f4f1e8; --ink: #15140f; --ink-2: #46443d;
    --accent: #a3cfdc; --accent-deep: #3f7f97;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: var(--paper);
    /* faint drafting grid */
    background-image:
      linear-gradient(to right, rgba(21, 20, 15, 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(21, 20, 15, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .card {
    position: absolute; inset: 40px 46px 46px 40px;
    background: var(--paper-2);
    border: 2px solid var(--ink); border-radius: 10px;
    box-shadow: 10px 10px 0 var(--ink);
    padding: 62px 68px; box-sizing: border-box;
  }
  .logo { display: inline-flex; align-items: center; gap: 3px; --H: 65px; }
  .logo img { display: block; height: calc(var(--H) * 0.86); width: calc(var(--H) * 0.86); }
  .wordmark {
    font-family: 'Epetri', monospace; font-weight: 400; letter-spacing: 0.08em;
    font-size: calc(var(--H) * 0.74);
    background: repeating-linear-gradient(to bottom, var(--ink) 0, var(--ink) 0.15em, #6f6d65 0.15em, #6f6d65 0.22em);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    -webkit-font-smoothing: none;
  }
  h1 {
    margin: 42px 0 0; font-size: 68px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.18; color: var(--ink);
  }
  .sub {
    margin: 20px 0 0; font-size: 29px; font-weight: 600; line-height: 1.45;
    color: var(--ink-2); max-width: 900px;
  }
  .sub b { color: var(--accent-deep); font-weight: 600; }
  .foot {
    position: absolute; left: 68px; right: 68px; bottom: 48px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pill {
    font-family: var(--mono); font-size: 27px; font-weight: 700; color: var(--ink);
    background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
    padding: 10px 24px; box-shadow: 5px 5px 0 var(--ink);
  }
  .badge {
    font-family: var(--mono); font-size: 22px; color: var(--ink);
    background: rgba(163, 207, 220, 0.55); border: 2px solid var(--ink); border-radius: 12px;
    padding: 10px 20px;
  }
</style>
<div class="card">
  <div class="logo"><img src="/favicon.svg" alt=""><span class="wordmark">tratless</span></div>
  <h1>Made for your AI.<br>Meant for you.</h1>
  <p class="sub">stratless reads your chats and teaches your AI <b>who you are</b>,<br>so it stops talking over your head or under it.</p>
  <div class="foot">
    <span class="pill">npx stratless</span>
    <span class="badge">Open source · runs on your machine</span>
  </div>
</div>
