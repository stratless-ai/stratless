name: web

# stratless.com → Cloudflare Pages (Direct Upload; the project is `stratless`).
#
# This is the deploy path: a push to main that touches web/ builds the site and ships it here, and the
# post-deploy smoke test (below) fails the run if the live domain doesn't answer, so a green main equals
# what is on the domain. Requires two repo secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    # cli/ is a BUILD INPUT of the site: nuxt.config reads cli/package.json (the version badge)
    # and counts cli/src (the line-count trust claim). A cli-only merge must redeploy or the
    # badge lies — 0.3.0 shipped and the site said v0.2.4 until a hand-run dispatch (2026-07-17).
    paths: ['web/**', '.github/workflows/web.yml', 'pnpm-lock.yaml', 'cli/package.json', 'cli/src/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: build + deploy → Cloudflare Pages
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with: { version: 9.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # nuxi generate prerenders every route to static HTML. A broken import or a failed prerender
      # dies HERE — the gate before anything reaches the domain.
      - run: pnpm --filter ./web generate
      # THE FONT GATE — the check that did not exist when `font-display: optional` shipped and left 9
      # of every 12 first-time visitors reading the site in system sans for four days. `nuxi generate`
      # cannot catch that (it never evaluates @font-face) and the smoke test below cannot either (it
      # discards the body). This drives a real browser with a cold profile on a throttled link, which
      # is the only condition where the failure exists. It runs BEFORE deploy, so a regression stops
      # here instead of reaching the domain. Details: web/scripts/check-fonts.mjs
      - name: font gate
        run: pnpm --filter ./web check:fonts
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: deploy
        run: pnpm --filter ./web exec wrangler pages deploy .output/public --project-name=stratless --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: post-deploy smoke
        run: |
          set -euo pipefail
          echo "→ GET https://stratless.com/"
          curl -fsSL --max-time 25 -o /dev/null "https://stratless.com/"
          echo "→ GET https://stratless.com/docs/"
          curl -fsSL --max-time 25 -o /dev/null "https://stratless.com/docs/"
          echo "✓ smoke passed"
