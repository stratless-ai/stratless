name: docs nudge

# House rule (AGENTS.md): docs move with the code. The 0.2.4 release shipped a new meter and a
# synthesis gate while the npm README kept documenting the old behavior — on a product whose moat
# is cost honesty. This is the soft guard: a PR that changes cli/src/ but does not touch the npm
# README gets ONE bot comment. It never blocks — refactors are real; a human
# decides whether the docs needed to move.

# WHY pull_request_target AND NOT pull_request. On a `pull_request` event raised from a FORK, GitHub
# caps GITHUB_TOKEN at read-only no matter what the `permissions:` block below asks for — so
# `gh pr comment` would 403 and this job would fail red on the first outside contribution this repo
# ever receives. (Never seen: zero forks so far.) `pull_request_target` runs the workflow file from
# the BASE branch with a real write token, which is why a fork cannot edit this file to steal it.
#
# That trade is only safe because of the rule below: THIS WORKFLOW NEVER CHECKS OUT, BUILDS, OR RUNS
# PR CODE. There is no `actions/checkout` step on purpose — the changed-file list comes from the API
# instead of a git diff, so no untrusted byte ever reaches the runner. If anyone ever adds a checkout
# here, this must go back to `pull_request`.
on:
  pull_request_target:
    paths: ['cli/src/**']

permissions:
  pull-requests: write

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: comment when cli changed but the docs did not
        env:
          GH_TOKEN: ${{ github.token }}
          # There is deliberately no checkout here (see above), so `gh pr view` / `gh pr comment`
          # have no local git repo to infer the target from — GH_REPO names it for every gh call.
          # Without it they die on "not a git repository", found the first time a cli/src PR
          # actually arrived without docs (PR #78, 2026-08-07); every earlier PR exited at the
          # docs grep before reaching them.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The API's file list, not a git diff. It is already the merge-base comparison GitHub shows
          # in the Files tab, so it needs no clone, no fetch-depth, and no base SHA arithmetic — which
          # also retires the stacked-branch failure this job hit in PR #27 (2026-07-20): a PR based on
          # a branch that was later deleted made `git fetch origin <name>` exit 128 for a reason that
          # had nothing to do with the diff.
          changed="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          echo "$changed"
          if grep -qE '^cli/README\.md$' <<<"$changed"; then
            echo "docs moved too — nothing to say."
            exit 0
          fi
          marker="<!-- docs-nudge -->"
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "already nudged this PR."
            exit 0
          fi
          gh pr comment "$PR" --body "$marker
          **Docs nudge:** this PR changes \`cli/src/\` but does not touch \`cli/README.md\`. House rule: if behavior changed, the npm guide moves in the same PR. If this is a pure refactor with no surface change, ignore me — I only comment once."
          echo "nudged."
