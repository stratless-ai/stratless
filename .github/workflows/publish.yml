name: publish

# Publishes `stratless` to npm on a `cli-v*` tag (or a manual trust probe — see the publish step).
#
# Separate from cli.yml on purpose: cli.yml has a `paths:` filter, and GitHub applies paths filters to
# tag pushes too — a tag on an existing commit carries no file changes, so the job would silently never
# run. This file has no paths filter, so that can't happen.
#
# The gates re-run here even though cli.yml already ran them: that run tested whatever was on main at the
# time, but this tag may point elsewhere, and a publish can't be taken back — so it re-earns its green on
# the exact commit being shipped.
#
# --provenance: stratless reads your private history and asks you to trust it; a tarball on npm that
# couldn't be tied back to this source would ask for that trust blind. Provenance makes npm mint a signed
# Sigstore attestation binding the tarball to this repo, commit, and run — anyone can verify with
# `npm audit signatures` that what's on npm is what's on main.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: verify · sign · publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release (the CHANGELOG mirror step below); npm needs no repo perms
      id-token: write # mint the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1. Node 22 ships npm 10, which doesn't speak OIDC: it would
      # publish with no credential and take npm's 404 — an E404 on a package you own that looks like a
      # registry problem and is really an out-of-date client.
      - name: npm >= 11.5.1 (Trusted Publishing needs it; Node 22 ships npm 10)
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) · node $(node --version)"

      # Tag and package.json hold one number in two places and drift silently. Fail loudly here rather
      # than ship the wrong version. Skipped on workflow_dispatch, where there is no tag.
      - name: the tag must equal the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#cli-v}"
          pkg="$(node -p "require('./cli/package.json').version")"
          echo "tag: cli-v$tag   package.json: $pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag cli-v$tag ≠ package.json $pkg"; exit 1; }

      # Two releases shipped with their CHANGELOG date still "unreleased" (0.3.1, 0.3.2 — both
      # caught after the fact). Dates are gated now, never remembered.
      - name: the changelog must carry a date for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#cli-v}"
          # Require a date for this version, regardless of the separator (— or ·): the gate is about
          # the date existing, not the punctuation around it.
          grep -qE "^## \[$v\][^0-9]*[0-9]{4}-[0-9]{2}-[0-9]{2}" cli/CHANGELOG.md \
            || { echo "::error::CHANGELOG [$v] has no release date, still 'unreleased'"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./cli exec tsc --noEmit
      - run: pnpm --filter ./cli build
      - run: pnpm --filter ./cli test

      # No token. Publishes over npm Trusted Publishing (OIDC): GitHub mints a short-lived identity token
      # proving which repo/workflow/commit is asking, and npm checks it against the trusted publisher
      # configured on the package — no long-lived credential exists to leak.
      #
      # A workflow_dispatch run is a TRUST PROBE, not a release: it re-publishes the version already on
      # the registry. npm authenticates first and checks for a duplicate second, so "cannot publish over
      # the previously published versions" is the one error that proves the trust is intact — that is the
      # pass. ENEEDAUTH / EOTP / E404 mean the trust is broken; those stay red.
      - name: npm publish (trusted publishing — OIDC, no token)
        working-directory: cli
        run: |
          set -o pipefail
          out=$(npm publish --provenance --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && grep -q "cannot publish over the previously published versions" <<<"$out"; then
            echo "::notice::OIDC trust VERIFIED — npm authenticated us with no token, then refused the duplicate. This is the pass."
            exit 0
          fi
          exit 1

      # Prove it from outside: a green publish means npm accepted the tarball, not that the world can
      # install it. Tags only — on a trust probe there is no published tag to install.
      - name: a stranger installs it from the registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            npm view "stratless@${GITHUB_REF_NAME#cli-v}" version && break
            echo "  not on the registry yet — retry $i"; sleep 12
          done
          cd "$(mktemp -d)"
          npm install -g "stratless@${GITHUB_REF_NAME#cli-v}"
          stratless --help | grep -q "stratless tune"
          npm audit signatures --prefix "$(npm root -g)/.." || true
          echo "✓ installed from npm and ran"

      # The GitHub Release mirrors the CHANGELOG — created HERE so a version can never again ship on
      # npm and be missing from the Releases page (0.2.4 did exactly that: the notes were a separate
      # manual step, and manual steps get forgotten). The changelog stays the single hand-written
      # source; if it has no section for this version, this fails LOUDLY rather than shipping a
      # note-less release. A release someone already made by hand is left untouched. The title picks
      # up an optional tagline from the heading — `## [x.y.z] — 2026-01-01 — the tagline` — else it
      # is plain `stratless x.y.z` (edit the title on GitHub afterwards if you want one).
      - name: mirror the CHANGELOG to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#cli-v}"
          if gh release view "$GITHUB_REF_NAME" --json name >/dev/null 2>&1; then
            echo "::notice::a release for $GITHUB_REF_NAME already exists — leaving it alone."
            exit 0
          fi
          # Both derived by .github/scripts/release-notes.sh, which cli.yml's `release gates` job runs
          # against this same changelog on EVERY pull request. That is the point of it being a file:
          # this step used to hold the only copy of the logic, and this workflow only runs on a tag —
          # so the title parser was broken for nine releases with nothing to notice (#61). A missing
          # or empty section exits non-zero there, which fails this step loudly rather than shipping
          # a note-less release; write the notes, then `gh release create` by hand.
          notes="$(.github/scripts/release-notes.sh --notes "$v")"
          title="$(.github/scripts/release-notes.sh --title "$v")"
          notes="$notes

          ---

          Published to npm over Trusted Publishing (OIDC, no token) with Sigstore provenance — verify with \`npm audit signatures\`."
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes "$notes"
          echo "✓ release published: $title"
