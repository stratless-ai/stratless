name: publish

# Publishes `stratless` to npm. Fires ONLY on a `cli-v*` tag.
#
# ─── why this is its own file, and not a job in cli.yml ───────────────────────────────────────
# cli.yml has a `paths:` filter. GitHub applies `paths:` to EVERY push matched by the trigger —
# tag pushes included. A tag pointing at a commit already on main carries no file changes, so the
# paths filter matches nothing and the job silently never runs. No error, no red X, just an empty
# npm registry and an afternoon of confusion. This file has no paths filter, so it cannot happen.
#
# ─── why the gates run again here ─────────────────────────────────────────────────────────────
# It would be cheaper to depend on cli.yml's green run. But that run tested whatever was on main
# at the time; this tag might point somewhere else entirely. A publish is the one thing you cannot
# take back, so it re-earns its green on the exact commit being shipped.
#
# ─── why --provenance ─────────────────────────────────────────────────────────────────────────
# stratless exists to say "this line came from that decision — here is the receipt". A stratless
# tarball arriving on npm from an unknown laptop, unverifiable, would be the tool failing its own
# test in public. --provenance makes npm mint a signed Sigstore attestation binding this tarball
# to this repo, this commit, this run. npm shows "Built and signed on GitHub Actions"; anyone can
# check it with `npm audit signatures`. It is also the only thing that will ever assert that what
# is on npm equals what is on main.
#
# ─── after the first publish ──────────────────────────────────────────────────────────────────
# NPM_TOKEN exists only because npm's Trusted Publishing must be configured on a package that
# already exists — you cannot preconfigure a name nobody owns. Once stratless@0.1.0 is live:
# configure Trusted Publishing on npmjs.com, delete the NPM_TOKEN secret, revoke the token.
# Provenance keeps working automatically over OIDC. Zero long-lived npm credentials.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: verify · sign · publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the provenance attestation
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1. Node 22 ships npm 10.x, which does not know OIDC
      # exists — it will not fail loudly, it will PUT the tarball with NO credential and take
      # npm's 404 (npm masks unauthorized publishes as 404 so it cannot be used to probe which
      # package names are taken). The symptom is an E404 on a package you own, which reads like a
      # registry problem and is actually a client that is eight months out of date.
      - name: npm >= 11.5.1 (Trusted Publishing needs it; Node 22 ships npm 10)
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) · node $(node --version)"

      # The tag and package.json are TWO PLACES holding ONE number, and they drift in silence.
      # Tag cli-v0.2.0 against a package.json still reading 0.1.0 and npm either rejects it as a
      # duplicate or ships the wrong version under the right name. Fail here instead, loudly.
      #
      # Skipped on workflow_dispatch, where the ref is a branch and there is no tag to compare.
      # A manual run is how you PROVE the OIDC trust still works: it attempts to publish whatever
      # version is on main, npm authenticates FIRST and rejects the duplicate SECOND, so an
      # "E403 cannot publish over previously published versions" is a PASS — it means npm knew who
      # we were. ENEEDAUTH/EOTP/401 would mean the trusted publisher is not wired up.
      - name: the tag must equal the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#cli-v}"
          pkg="$(node -p "require('./cli/package.json').version")"
          echo "tag: cli-v$tag   package.json: $pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag cli-v$tag ≠ package.json $pkg"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./cli exec tsc --noEmit
      - run: pnpm --filter ./cli build
      - run: pnpm --filter ./cli test

      # NO TOKEN. This publishes over npm Trusted Publishing (OIDC): GitHub mints a short-lived
      # identity token proving to npm which repo, which workflow file and which commit is asking,
      # and npm checks that against the trusted publisher configured on the package itself.
      #
      # There is no long-lived credential in existence to leak. The NPM_TOKEN that published 0.1.0
      # had "Bypass 2FA" switched ON — it had to, or CI could never publish — which made it a
      # credential that could push code to every machine that runs `npm i -g stratless`, with no
      # second factor. It existed for eleven minutes and was revoked. Do not bring it back.
      #
      # Provenance is automatic under OIDC (npm signs without being asked); --provenance is kept
      # only so a laptop publish, if anyone ever tries one, still signs.
      - name: npm publish (trusted publishing — OIDC, no token)
        working-directory: cli
        run: |
          set -o pipefail
          out=$(npm publish --provenance --access public 2>&1) && { echo "$out"; exit 0; }
          echo "$out"

          # A MANUAL RUN IS A TRUST PROBE, NOT A RELEASE.
          #
          # It re-publishes the version already on the registry. npm authenticates FIRST and
          # checks for a duplicate SECOND — so "cannot publish over the previously published
          # versions" is the ONLY error that proves the OIDC trust is intact: npm knew who we
          # were, found us to be the owner, and refused for the one harmless reason. That is a
          # PASS, and it must be green, because a red X that means "fine, ignore it" is a lie
          # you will either panic at or learn to ignore — and then miss the real one.
          #
          # Anything else — ENEEDAUTH, EOTP, E404 (npm masks unauthorized publishes as 404) —
          # means the trust is BROKEN and you would only find out mid-release. Those stay red.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && grep -q "cannot publish over the previously published versions" <<<"$out"; then
            echo "::notice::OIDC trust VERIFIED — npm authenticated us with no token, then refused the duplicate. This is the pass."
            exit 0
          fi
          exit 1

      # Prove it, from outside. A green publish step means npm accepted the tarball; it does not
      # mean the world can install it, and it does not mean the signature is real.
      #
      # TAGS ONLY. On a manual trust probe there is no tag, so GITHUB_REF_NAME is "main" and this
      # spends two minutes retrying `npm view stratless@main` before failing — a release check
      # running during a probe, turning a passing probe red for a reason that has nothing to do
      # with the thing being probed.
      - name: a stranger installs it from the registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            npm view "stratless@${GITHUB_REF_NAME#cli-v}" version && break
            echo "  not on the registry yet — retry $i"; sleep 12
          done
          cd "$(mktemp -d)"
          npm install -g "stratless@${GITHUB_REF_NAME#cli-v}"
          stratless --help | grep -q "stratless why"
          npm audit signatures --prefix "$(npm root -g)/.." || true
          echo "✓ installed from npm and ran"
