name: cli

# The CLI had NO CI at all until 2026-07-14 — its tests had never run anywhere but a laptop, and
# a missing file (canary.ts) once shipped a repo that did not build. This is the gate.
on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml', 'pnpm-lock.yaml']
  # NO paths filter on pull_request, on purpose. These two jobs are REQUIRED status checks on main,
  # and a required check that never runs never passes — it sits at "waiting for status to be reported"
  # and the PR can never merge. A paths filter here would deadlock every web-only PR. Two minutes of
  # CI on a copy change is the price of the gate being real. (Keep the push filter: nothing gates it.)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with: { version: 9.15.0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./cli exec tsc --noEmit
      - run: pnpm --filter ./cli build
      - run: pnpm --filter ./cli test

  # A STRANGER CLONES IT AND IT RUNS. That is the bar, and it is not the same as "the tests pass"
  # — a file can be missing from git and still be on the developer's disk. It happened.
  stranger:
    name: a stranger clones it and it runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 22 }
      - name: build from a clean checkout, with npm, like anyone would
        run: |
          set -euo pipefail
          cd cli
          npm install --no-package-lock
          npx tsc --noEmit
          npx tsc
          node dist/index.js --help | grep -q "stratless profile"
          echo "✓ a clean clone builds and runs"
